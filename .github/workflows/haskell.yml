name: Haskell CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Nix store
      uses: actions/cache@v6
      with:
        path: /nix
        key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-keys: nix-${{ runner.os }}-

    - name: Build & Test
      run: nix develop --command cabal test --test-show-details=streaming

    - name: Install
      run: |
        mkdir dist
        nix develop --command cabal install --installdir=dist --install-method=copy

    - name: Store Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mqtt-bridge
        path: dist
